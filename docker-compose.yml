version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dz-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dzuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dzpass}
      POSTGRES_DB: ${POSTGRES_DB:-dzbiometric}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dzuser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: ai/Dockerfile
    container_name: dz-ai-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ai:/app/ai
      - ./storage:/app/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dz-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://\( {POSTGRES_USER:-dzuser}: \){POSTGRES_PASSWORD:-dzpass}@postgres:5432/${POSTGRES_DB:-dzbiometric}
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
    volumes:
      - ./backend:/app/backend
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  storage: