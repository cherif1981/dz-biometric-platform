version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: dz-postgres

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: dz-redis

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes

    expose:
      - "6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    networks:
      - internal

  ai-service:
    build:
      context: .
      dockerfile: ai/Dockerfile

    container_name: dz-ai-service

    environment:
      PYTHONUNBUFFERED: "1"

    volumes:
      - storage:/app/storage

    expose:
      - "8001"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8001/')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    read_only: true

    tmpfs:
      - /tmp

    restart: unless-stopped

    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: dz-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AI_SERVICE_URL: http://ai-service:8001
      STORAGE_PATH: /app/storage

    volumes:
      - storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    networks:
      - internal

volumes:
  pgdata:
  storage:

networks:
  internal:
    driver: bridge
