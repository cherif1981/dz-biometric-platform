version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: dz-postgres

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: dz-redis

    env_file:
      - .env

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    networks:
      - internal

  ai-service:
    build:
      context: .
      dockerfile: ai/Dockerfile

    container_name: dz-ai-service

    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: "1"
      STORAGE_PATH: ${STORAGE_PATH}
      ENVIRONMENT: ${ENVIRONMENT}

    volumes:
      - storage:/app/storage

    expose:
      - "8001"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8001/')"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: dz-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      REDIS_URL: ${REDIS_URL}

      AI_SERVICE_URL: ${AI_SERVICE_URL}
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT}

      STORAGE_PATH: ${STORAGE_PATH}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}

      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY}

      DOCUMENT_RETENTION_DAYS: ${DOCUMENT_RETENTION_DAYS}
      SELFIE_RETENTION_DAYS: ${SELFIE_RETENTION_DAYS}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS}

      DEBUG: ${DEBUG}
      ENVIRONMENT: ${ENVIRONMENT}
      LOG_LEVEL: ${LOG_LEVEL}

      APP_NAME: ${APP_NAME}

      CORS_ORIGINS: ${CORS_ORIGINS}

      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}

    volumes:
      - storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      ai-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    networks:
      - internal

volumes:
  pgdata:
  storage:

networks:
  internal:
    driver: bridge
