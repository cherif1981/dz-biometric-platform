version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # SEC-06: لا منافذ على المضيف في الإنتاج — nginx يُواجه الخارج
    expose:
      - "8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # SEC-09: لا بيانات اعتماد ثابتة — تُقرأ من أسرار Docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dz_app}
      POSTGRES_DB: ${POSTGRES_DB:-dz_biometric}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    # SEC-06: لا ports — فقط expose داخلي
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dz_app} -d $${POSTGRES_DB:-dz_biometric}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # SEC-06: لا ports
    expose:
      - "6379"
    command: >
      sh -c 'redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    networks:
      - backend
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: celery -A src.workers.celery_app worker -l info
    networks:
      - backend
    secrets:
      - db_password
      - redis_password
    restart: unless-stopped

  # SEC-06: الخدمة الوحيدة المُعرَّضة على المضيف
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  pgdata:

# SEC-09: أسرار خارج المستودع (غير مرفوعة إلى git)
secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
