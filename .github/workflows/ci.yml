name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libs (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0 || true

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # httpx2: مطلوبة لـ starlette.testclient (FastAPI TestClient)
          # pytest-asyncio: تمنع تحذير "Unknown config option: asyncio_mode"
          pip install pytest pytest-asyncio httpx2 pyyaml loguru
          # تبعيات النماذج (تُتخطى إن لم تكن هناك حاجة)
          pip install onnxruntime opencv-python-headless numpy || true

      - name: Verify TestClient import
        run: python -c "from fastapi.testclient import TestClient; print('TestClient OK')"

      - name: Run tests (if any)
        run: |
          if find tests -name "test_*.py" 2>/dev/null | grep -q .; then
            pytest tests/ -v --no-header
          else
            echo "No pytest tests found — skipping"
          fi

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - name: Bandit SAST (informative)
        run: bandit -r src/ -ll -x tests/ || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
