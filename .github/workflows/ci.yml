name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff (version épinglée)
        run: pip install "ruff==0.4.10"

      - name: Show ruff version
        run: ruff --version

      - name: Validate pyproject.toml
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb')); print('TOML OK')"

      - name: Show effective ruff config
        run: ruff check src/ --show-settings || true

      - name: Run ruff (lint)
        run: ruff check src/

      - name: Run ruff (format check)
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libs (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Uninstall conflicting OpenCV packages
        run: |
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true

      - name: Install OpenCV contrib (CascadeClassifier)
        run: pip install "opencv-contrib-python-headless==4.6.0.66"

      - name: Verify CascadeClassifier
        run: python -c "import cv2; assert hasattr(cv2, 'CascadeClassifier'), 'CascadeClassifier still missing'; print('CascadeClassifier OK')"

      - name: Purge all OpenCV variants
        run: |
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip cache purge || true

      - name: Install OpenCV contrib (with CascadeClassifier)
        run: pip install --no-cache-dir "opencv-contrib-python-headless==4.6.0.66"

      - name: Verify CascadeClassifier (fail fast)
        run: |
          python - <<'PY'
          import cv2, sys
          print("cv2 version:", cv2.__version__)
          print("cv2 file:", cv2.__file__)
          if not hasattr(cv2, "CascadeClassifier"):
              print("ERROR: CascadeClassifier missing", file=sys.stderr)
              sys.exit(1)
          # اختبر تحميل cascade فعلي
          path = cv2.data.haarcascades + "haarcascade_frontalface_default.xml"
          clf = cv2.CascadeClassifier(path)
          if clf.empty():
              print("ERROR: cascade file empty", file=sys.stderr)
              sys.exit(1)
          print("CascadeClassifier OK")
          PY

      - name: Purge any OpenCV variant (avoid cv2 shadowing)
        run: |
          pip uninstall -y opencv-python opencv-python-headless opencv-contrib-python opencv-contrib-python-headless || true
          pip cache purge || true

      - name: Install OpenCV (modern, cp311 wheel, numpy 2.x compatible)
        run: |
          pip install --no-cache-dir "opencv-contrib-python-headless>=4.10.0,<5" "numpy>=1.26,<3"

      - name: Verify CascadeClassifier + haarcascades
        run: |
          python - <<'PY'
          import sys, cv2
          print("cv2 version:", cv2.__version__)
          print("cv2 file:", cv2.__file__)
          assert hasattr(cv2, "CascadeClassifier"), "CascadeClassifier missing"
          path = cv2.data.haarcascades + "haarcascade_frontalface_default.xml"
          clf = cv2.CascadeClassifier(path)
          assert not clf.empty(), f"cascade empty: {path}"
          print("OK: CascadeClassifier + haarcascades working")
          PY

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx pyyaml loguru onnxruntime numpy opencv-contrib-python-headless==4.6.0.66

      - name: Verify TestClient import
        run: python -c "from fastapi.testclient import TestClient; print('TestClient OK')"

      - name: Verify cv2 import
        run: python -c "import cv2; print('cv2 OK, version:', cv2.__version__)"

      - name: Verify app import
        run: python -c "from src.main import app; print('app OK')"

      - name: Run tests (if any)
        run: |
          if find tests -name "test_*.py" 2>/dev/null | grep -q .; then
            pytest tests/ -v --no-header --pythonpath=. --continue-on-collection-errors --tb=short
          else
            echo "No pytest tests found — skipping"
          fi

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Bandit SAST
        run: bandit -r src/ -ll -x tests/

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
