name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pytest pytest-asyncio

      - name: Ruff (strict — fails on errors)
        run: ruff check src/ tests/ --output-format=github

      - name: Bandit (strict — fails on findings)
        run: |
          set -e
          bandit -r src/ -ll -x tests/ -f json -o bandit.json || {
            echo "::error::Bandit found security issues"; cat bandit.json; exit 1;
          }

      - name: Ensure tests exist
        run: |
          set -e
          if ! find tests -name "test_*.py" | grep -q .; then
            echo "::error::No tests found — failing CI"; exit 1
          fi

      - name: Run tests
        run: pytest tests/ -v --maxfail=1 --disable-warnings
