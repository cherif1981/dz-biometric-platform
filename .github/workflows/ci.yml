name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff (auto-fix)
        run: |
          ruff check src/ --fix
          ruff format src/
      - name: Run ruff (verify)
        run: ruff check src/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libs (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx pyyaml loguru
          pip install onnxruntime opencv-python-headless numpy

      - name: Verify TestClient import
        run: python -c "from fastapi.testclient import TestClient; print('TestClient OK')"

      - name: Verify cv2 import
        run: python -c "import cv2; print('cv2 OK, version:', cv2.__version__)"

      - name: Verify app import
        run: python -c "from src.main import app; print('app OK')"

      - name: Run tests (if any)
        run: |
          if find tests -name "test_*.py" 2>/dev/null | grep -q .; then
            pytest tests/ -v --no-header --pythonpath=. --continue-on-collection-errors
          else
            echo "No pytest tests found — skipping"
          fi

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bandit
        run: pip install bandit
      - name: Bandit SAST (informative)
        run: bandit -r src/ -ll -x tests/
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}