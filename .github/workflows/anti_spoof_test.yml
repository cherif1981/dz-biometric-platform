name: Anti-Spoof Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt onnxruntime pytest
      - name: Download model
        run: |
          wget -O MiniFASNetV2.onnx https://huggingface.co/danelcsb/face/resolve/main/minifasnet_v2.onnx
      - name: Run tests
        run: pytest tests/test_preprocessing.py -v
