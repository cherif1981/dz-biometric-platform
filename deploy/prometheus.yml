global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: dz-biometric
    metrics_path: /metrics
    static_configs:
      # host.docker.internal works on Docker Desktop (mac/win).
      # On Linux, use extra_hosts or replace with the app container name.
      - targets: ["host.docker.internal:8000"]
        labels:
          service: dz-biometric-platform
          env: dev

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
