[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    -q
    --strict-markers
    --disable-warnings
    --cov=backend/app
    --cov=ai
    --cov-report=term-missing
    --cov-report=html:htmlcov
markers =
    slow: marks tests as slow
    integration: marks tests as integration
    ai: marks tests related to AI service
asyncio_mode = auto